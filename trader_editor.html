<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кузница Скальда - Редактор Торговцев для KGMarketPlace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-brand">
        <img src="https://enotinmax.github.io/skald/logo.png" alt="Logo" class="logo" onerror="this.src='https://via.placeholder.com/40?text=S'">
        <div class="header-text">
            <h1>Кузница Скальда</h1>
            <div class="subtitle">Редактор профилей торговцев для KGMarketPlace</div>
        </div>
    </div>
    <div class="header-controls">
        <a href="index.html" class="secondary" style="padding: 8px 14px; border-radius: 4px; text-decoration: none; color: white; font-size: 13px;">← К редактору диалогов</a>
    </div>
</header>

<main class="trader-layout">
    <div class="trader-code-panel">
        <div class="tabs-container" id="tabsContainer">
            <button class="tab-add" onclick="addNewTab()" title="Новая вкладка">+</button>
        </div>
        
        <textarea id="cfgInput" class="code-editor" placeholder="[TestTrader]&#10;Coins, 100, SwordIron, 1, 2&#10;BlackMetal, 1, 2 = AxeBlackMetal, 1, 9"></textarea>
        <div class="code-actions">
            <button class="secondary" onclick="document.getElementById('fileInput').click()">Импорт</button>
            <input type="file" id="fileInput" accept=".cfg,.txt" style="display: none;" onchange="handleFileImport(event)">
            <button class="secondary" onclick="exportCFG()">💾 Экспорт</button>
            <button class="secondary" onclick="loadSample()">Пример</button>
            <button class="secondary" onclick="clearCurrentConfig()">Очистить</button>
            
            <div class="path-hint">
                Файл нужно поместить в<br>
                <code>Valheim\BepInEx\config\Marketplace\Configs\Traders</code>
            </div>
        </div>
    </div>

    <div class="trader-preview-panel">
        <div class="preview-header">
            <h2>Торговец</h2>
        </div>
        <div class="preview-content" id="gamePreview">
            <div class="empty-preview">Ожидание данных...</div>
        </div>
    </div>

    <div class="trader-editor-panel">
        <div id="editorPanel" class="editor-content">
            <div class="empty-state-trader">Загрузите .cfg или нажмите «Пример»</div>
        </div>
    </div>
</main>

<div style="position: fixed; bottom: 20px; right: 20px; z-index: 100;">
    <button class="btn-primary" onclick="addNewProfile()" style="box-shadow: 0 4px 15px rgba(0,0,0,0.5);">Добавить профиль</button>
</div>

<script>
    let itemsData = [];
    let dataLoaded = false;
    let isSyncing = false;
    let syncTimeout;
    
    let configs = [];
    let activeConfigId = null;
    let tabCounter = 0;
    let pendingRenameConfigId = null;
    let profiles = [];

    function generateRandomId() {
        return Math.random().toString(36).substring(2, 8);
    }

    function createConfig(name = null, code = '', profilesData = []) {
        tabCounter++;
        const finalName = name || `skald_trader_${generateRandomId()}.cfg`;
        return {
            id: `config_${tabCounter}`,
            name: finalName,
            code: code,
            profiles: profilesData
        };
    }

    function addNewTab() {
        const newConfig = createConfig();
        configs.push(newConfig);
        switchToTab(newConfig.id);
    }

    function switchToTab(configId) {
        if (activeConfigId) {
            const currentConfig = configs.find(c => c.id === activeConfigId);
            if (currentConfig) {
                currentConfig.code = document.getElementById('cfgInput').value;
                currentConfig.profiles = JSON.parse(JSON.stringify(profiles));
            }
        }
        
        activeConfigId = configId;
        const config = configs.find(c => c.id === configId);
        
        if (config) {
            document.getElementById('cfgInput').value = config.code;
            profiles = JSON.parse(JSON.stringify(config.profiles));
            renderTabs();
            renderAll();
            
            if (pendingRenameConfigId === configId) {
                pendingRenameConfigId = null;
                setTimeout(() => {
                    const tab = document.querySelector(`.tab[data-config-id="${configId}"]`);
                    if (tab) {
                        const nameSpan = tab.querySelector('.tab-name');
                        if (nameSpan) startRenameTab(configId, nameSpan);
                    }
                }, 0);
            }
        }
    }

    function closeTab(configId, event) {
        event.stopPropagation();
        
        if (configs.length <= 1) {
            alert('Нельзя закрыть последнюю вкладку');
            return;
        }
        
        const index = configs.findIndex(c => c.id === configId);
        if (index === -1) return;
        
        configs.splice(index, 1);
        
        if (activeConfigId === configId) {
            const newIndex = Math.min(index, configs.length - 1);
            switchToTab(configs[newIndex].id);
        } else {
            renderTabs();
        }
    }

    function startRenameTab(configId, nameSpan) {
        const config = configs.find(c => c.id === configId);
        if (!config) return;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'tab-name-input';
        input.value = config.name;
        
        nameSpan.replaceWith(input);
        input.focus();
        input.select();
        
        let finished = false;
        const finishRename = () => {
            if (finished) return;
            finished = true;
            const newName = input.value.trim();
            if (newName) {
                config.name = newName;
            }
            renderTabs();
        };
        
        input.addEventListener('blur', finishRename);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                input.blur();
            } else if (e.key === 'Escape') {
                input.value = config.name;
                input.blur();
            }
        });
    }

    function renderTabs() {
        const container = document.getElementById('tabsContainer');
        const addButton = container.querySelector('.tab-add');
        container.querySelectorAll('.tab').forEach(tab => tab.remove());
        
        configs.forEach(config => {
            const tab = document.createElement('button');
            tab.className = `tab ${config.id === activeConfigId ? 'active' : ''}`;
            tab.dataset.configId = config.id;
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'tab-name';
            nameSpan.textContent = config.name;
            nameSpan.title = 'Кликните для переименования';
            nameSpan.onclick = (e) => {
                e.stopPropagation();
                if (config.id !== activeConfigId) {
                    pendingRenameConfigId = config.id;
                    switchToTab(config.id);
                } else {
                    startRenameTab(config.id, nameSpan);
                }
            };
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'tab-close';
            closeBtn.textContent = '×';
            closeBtn.title = 'Закрыть вкладку';
            closeBtn.onclick = (e) => closeTab(config.id, e);
            
            tab.appendChild(nameSpan);
            tab.appendChild(closeBtn);
            
            tab.onclick = () => switchToTab(config.id);
            
            container.insertBefore(tab, addButton);
        });
    }

    function getCurrentConfig() {
        return configs.find(c => c.id === activeConfigId);
    }

    function safeParseJSON(text) {
        try {
            return JSON.parse(text);
        } catch (e) {
            console.warn('Стандартный JSON.parse не сработал:', e.message);
        }
        
        let fixed = text;
        fixed = fixed.replace(/\}\s*\n\s*\{/g, '},\n{');
        fixed = fixed.replace(/\}\s*\r\n\s*\{/g, '},\r\n{');
        fixed = fixed.replace(/\}\s*\{/g, '},{');
        
        try {
            const result = JSON.parse(fixed);
            console.log('✅ JSON успешно исправлен и распарсен');
            return result;
        } catch (e) {
            console.error('Не удалось исправить JSON:', e.message);
            return null;
        }
    }

    async function loadItemsData() {
        const url = 'https://raw.githubusercontent.com/EnotinMax/skald/main/icons/items.json';
        
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            const response = await fetch(url + '?v=' + Date.now(), {
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const text = await response.text();
            const parsed = safeParseJSON(text);
            
            if (!parsed || !Array.isArray(parsed)) {
                throw new Error('JSON не является массивом');
            }
            
            itemsData = parsed;
            console.log(`✅ Загружено ${itemsData.length} предметов`);
            dataLoaded = true;
            
            renderAll();
            
        } catch (err) {
            console.error('❌ Ошибка загрузки:', err);
            document.getElementById('gamePreview').innerHTML = `<div class="error-state"><p>Ошибка загрузки базы предметов</p><button onclick="loadItemsData()">Повторить</button></div>`;
        }
    }

    function getItemById(itemId) {
        if (!dataLoaded) return null;
        return itemsData.find(i => i.id === itemId);
    }

    function getItemIconUrl(itemId) {
        if (!dataLoaded) return 'https://raw.githubusercontent.com/EnotinMax/skald/main/icons/unknown.png';
        const item = getItemById(itemId);
        if (!item) return 'https://raw.githubusercontent.com/EnotinMax/skald/main/icons/unknown.png';
        return `https://raw.githubusercontent.com/EnotinMax/skald/main/icons/${item.icon}`;
    }

    function getItemName(itemId) {
        if (!dataLoaded) return itemId;
        const item = getItemById(itemId);
        return item ? (item.nameRu || item.name) : itemId;
    }

    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            const newConfig = createConfig(file.name, content);
            configs.push(newConfig);
            switchToTab(newConfig.id);
            parseCFG(content);
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function loadSample() {
        const exampleCFG = `[TestTrader]
Coins, 100, SwordIron, 1, 2
Wood, 1, Ruby, 10

[PetsTrader]
Stone, 100, Wolf, 1, 5
Ruby, 25, Boar, 10, 2

[AdvancedTrader]
SwordIron, 1, 9, Ruby, 666 = SwordIron, 1, 10
BlackMetal, 1, AxeBlackMetal, 1, 9, Coins, 25 = AxeBlackMetal, 1, 10, Wood, 123
Coins, 0 = AxeBlackMetal, 1, 9
Coins, 0, BlackMetal, 5`;
        
        document.getElementById('cfgInput').value = exampleCFG;
        parseCFG(exampleCFG);
    }

    function clearCurrentConfig() {
        const config = getCurrentConfig();
        if (!config) return;
        
        if (!confirm('Очистить текущую вкладку?')) return;
        
        config.code = '';
        config.profiles = [];
        document.getElementById('cfgInput').value = '';
        profiles = [];
        renderAll();
    }

    function parseSideTo(tokens, targetArray) {
        let i = 0;
        while (i < tokens.length) {
            const itemId = tokens[i];
            if (!itemId) { i++; continue; }
            const qty = parseInt(tokens[i+1]) || 1;
            let level = null;
            let nextIndex = i + 2;
            
            if (i + 2 < tokens.length) {
                const nextToken = tokens[i+2];
                if (/^\d+$/.test(nextToken)) {
                    level = parseInt(nextToken);
                    nextIndex = i + 3;
                }
            }
            targetArray.push({ itemId, quantity: qty, level });
            i = nextIndex;
        }
    }

    function parseCFG(text) {
        const lines = text.split('\n');
        profiles = [];
        let currentProfile = null;

        for (let line of lines) {
            line = line.trim();
            if (!line || line.startsWith('#') || line.startsWith(';')) continue;

            if (line.startsWith('[') && line.endsWith(']')) {
                currentProfile = { id: line.slice(1, -1).trim(), trades: [] };
                profiles.push(currentProfile);
            } else if (currentProfile) {
                const costs = [];
                const rewards = [];
                
                if (line.includes('=')) {
                    const parts = line.split('=');
                    const costTokens = parts[0].split(',').map(t => t.trim()).filter(t => t);
                    const rewardTokens = parts[1].split(',').map(t => t.trim()).filter(t => t);
                    parseSideTo(costTokens, costs);
                    parseSideTo(rewardTokens, rewards);
                } else {
                    const tokens = line.split(',').map(t => t.trim()).filter(t => t);
                    if (tokens.length >= 4) {
                        costs.push({ itemId: tokens[0], quantity: parseInt(tokens[1]) || 1, level: null });
                        rewards.push({ 
                            itemId: tokens[2], 
                            quantity: parseInt(tokens[3]) || 1, 
                            level: tokens.length >= 5 ? (parseInt(tokens[4]) || null) : null 
                        });
                    }
                }
                currentProfile.trades.push({ raw: line, costs, rewards, edited: false });
            }
        }
        
        const config = getCurrentConfig();
        if (config) {
            config.profiles = JSON.parse(JSON.stringify(profiles));
        }
        
        renderAll();
    }

    function generateCFG() {
        let output = '';
        for (const profile of profiles) {
            output += `[${profile.id}]\n`;
            for (const trade of profile.trades) {
                if (!trade.edited && trade.raw) {
                    output += `${trade.raw}\n`;
                } else {
                    const costStr = trade.costs.map(c => `${c.itemId}, ${c.quantity}${c.level ? `, ${c.level}` : ''}`).join(', ');
                    const rewardStr = trade.rewards.map(r => `${r.itemId}, ${r.quantity}${r.level ? `, ${r.level}` : ''}`).join(', ');
                    
                    const isSimple = trade.costs.length === 1 && trade.rewards.length === 1 && !trade.costs[0].level && (!trade.raw || !trade.raw.includes('='));
                    
                    if (isSimple) {
                        const c = trade.costs[0];
                        const r = trade.rewards[0];
                        output += `${c.itemId}, ${c.quantity}, ${r.itemId}, ${r.quantity}${r.level ? `, ${r.level}` : ''}\n`;
                    } else {
                        output += `${costStr} = ${rewardStr}\n`;
                    }
                }
            }
            output += '\n';
        }
        return output.trim();
    }

    function renderWithFocusRestore(renderFn) {
        const activeEl = document.activeElement;
        let focusPath = null, start = 0, end = 0;
        
        if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
            focusPath = activeEl.getAttribute('data-path');
            start = activeEl.selectionStart;
            end = activeEl.selectionEnd;
        }

        renderFn();

        if (focusPath) {
            setTimeout(() => {
                const newEl = document.querySelector(`[data-path="${focusPath}"]`);
                if (newEl) {
                    newEl.focus();
                    if (newEl.setSelectionRange) {
                        newEl.setSelectionRange(start, end);
                    }
                }
            }, 0);
        }
    }

    function renderAll() {
        renderWithFocusRestore(() => {
            renderVisual();
            renderPreview();
        });
    }

    function renderVisual() {
        const panel = document.getElementById('editorPanel');
        panel.innerHTML = '';

        if (!dataLoaded) {
            panel.innerHTML = '<div class="loading-state">Загрузка предметов...</div>';
            return;
        }

        if (profiles.length === 0) {
            panel.innerHTML = '<div class="empty-state-trader">Загрузите .cfg или нажмите «Пример»</div>';
            return;
        }

        profiles.forEach((profile, pIndex) => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            
            const header = document.createElement('div');
            header.className = 'profile-header';
            header.innerHTML = `<h3>Профиль:</h3><input type="text" class="form-control" value="${profile.id}" data-path="profile-${pIndex}-id" onchange="updateProfileId(${pIndex}, this.value)">`;
            
            const removeProfileBtn = document.createElement('button');
            removeProfileBtn.className = 'btn-small danger';
            removeProfileBtn.textContent = 'Удалить';
            removeProfileBtn.onclick = () => { profiles.splice(pIndex, 1); scheduleSync(); };
            header.appendChild(removeProfileBtn);
            card.appendChild(header);

            if (profile.trades.length === 0) {
                card.innerHTML += '<div style="color: var(--text-secondary); font-size: 12px; font-style: italic; margin-bottom: 8px;">Нет правил обмена</div>';
            }

            profile.trades.forEach((trade, tIndex) => {
                const row = document.createElement('div');
                row.className = 'trade-row';
                
                const costSide = document.createElement('div');
                costSide.innerHTML = '<div class="trade-side-header">Стоимость</div>';
                trade.costs.forEach((cost, cIndex) => {
                    costSide.appendChild(createItemRow(cost, pIndex, tIndex, 'costs', cIndex));
                });
                const addCostBtn = document.createElement('button');
                addCostBtn.className = 'btn-add-item';
                addCostBtn.textContent = '+ Добавить';
                addCostBtn.onclick = () => { 
                    trade.costs.push({ itemId: '', quantity: 1, level: null }); 
                    trade.edited = true; 
                    scheduleSync();
                };
                costSide.appendChild(addCostBtn);

                const sep = document.createElement('div');
                sep.className = 'trade-vertical-separator';
                sep.innerHTML = '<span>↓ ОБМЕН ↓</span>';

                const rewardSide = document.createElement('div');
                rewardSide.innerHTML = '<div class="trade-side-header">Награда</div>';
                trade.rewards.forEach((reward, rIndex) => {
                    rewardSide.appendChild(createItemRow(reward, pIndex, tIndex, 'rewards', rIndex));
                });
                const addRewardBtn = document.createElement('button');
                addRewardBtn.className = 'btn-add-item';
                addRewardBtn.textContent = '+ Добавить';
                addRewardBtn.onclick = () => { 
                    trade.rewards.push({ itemId: '', quantity: 1, level: null }); 
                    trade.edited = true; 
                    scheduleSync();
                };
                rewardSide.appendChild(addRewardBtn);

                const actions = document.createElement('div');
                actions.className = 'trade-actions';
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-remove-trade';
                delBtn.textContent = 'Удалить правило';
                delBtn.onclick = () => { profile.trades.splice(tIndex, 1); scheduleSync(); };
                actions.appendChild(delBtn);

                row.append(costSide, sep, rewardSide, actions);
                card.appendChild(row);
            });

            const addTradeBtn = document.createElement('button');
            addTradeBtn.className = 'btn-add-item';
            addTradeBtn.style.marginTop = '12px';
            addTradeBtn.textContent = '+ Добавить правило обмена';
            addTradeBtn.onclick = () => { 
                profile.trades.push({ 
                    raw: '', 
                    costs: [{ itemId: '', quantity: 1, level: null }], 
                    rewards: [{ itemId: '', quantity: 1, level: null }], 
                    edited: true 
                }); 
                scheduleSync();
            };
            card.appendChild(addTradeBtn);
            panel.appendChild(card);
        });
    }

      function createItemRow(itemData, pIndex, tIndex, side, itemIndex) {
        const row = document.createElement('div');
        row.className = 'trade-item-row';
        
        const selectorWrapper = document.createElement('div');
        selectorWrapper.className = 'item-selector';
        
        const inputWrapper = document.createElement('div');
        inputWrapper.className = 'item-selector-input-wrapper';
        
        const icon = document.createElement('img');
        icon.className = 'item-selector-icon';
        icon.src = getItemIconUrl(itemData.itemId);
        
        const input = document.createElement('input');
        input.className = 'item-selector-input';
        input.value = itemData.itemId;
        input.placeholder = 'Выберите предмет...';
        input.setAttribute('data-path', `p${pIndex}-t${tIndex}-${side}-${itemIndex}-id`);
        
        const dropdown = document.createElement('div');
        dropdown.className = 'item-selector-dropdown';
        
        inputWrapper.append(icon, input);
        selectorWrapper.append(inputWrapper, dropdown);
        
        function updateDropdown(filter = '') {
            if (!dataLoaded || itemsData.length === 0) return;
            
            dropdown.innerHTML = '';
            const lowerFilter = filter.toLowerCase();
            const filtered = itemsData.filter(item => {
                if (item.id.toLowerCase() === lowerFilter) return true;
                if (item.nameRu && item.nameRu.toLowerCase().includes(lowerFilter)) return true;
                if (item.name && item.name.toLowerCase().includes(lowerFilter)) return true;
                if (item.id.toLowerCase().includes(lowerFilter)) return true;
                return false;
            }).slice(0, 50);
            
            if (filtered.length === 0) {
                const div = document.createElement('div');
                div.className = 'item-option';
                div.style.color = 'var(--text-secondary)';
                div.style.fontStyle = 'italic';
                div.style.padding = '6px 10px';
                div.textContent = 'Не найдено (сохранится как кастомный ID)';
                dropdown.appendChild(div);
                dropdown.classList.add('active');
                return;
            }
            
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-option';
                div.dataset.id = item.id;
                div.innerHTML = `<img src="https://raw.githubusercontent.com/EnotinMax/skald/main/icons/${item.icon}" alt=""><div class="item-option-text"><span class="item-option-name">${item.nameRu || item.name}</span><span class="item-option-id">${item.id}</span></div>`;
                
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = item.id;
                    icon.src = `https://raw.githubusercontent.com/EnotinMax/skald/main/icons/${item.icon}`;
                    dropdown.classList.remove('active');
                    updateData(item.id);
                });
                dropdown.appendChild(div);
            });
            dropdown.classList.add('active');
        }
        
        function updateData(newId) {
            // Обновляем данные только при финальном выборе, а не во время печати
            profiles[pIndex].trades[tIndex][side][itemIndex].itemId = newId;
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleImmediateSync();
        }

        input.addEventListener('input', (e) => {
            if (dataLoaded) {
                updateDropdown(e.target.value);
            }
        });
        
        input.addEventListener('blur', () => { 
            setTimeout(() => { 
                dropdown.classList.remove('active');
                updateData(input.value);
            }, 150); 
        });
        
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                updateData(input.value);
                dropdown.classList.remove('active');
                input.blur();
            } else if (e.key === 'Escape') {
                dropdown.classList.remove('active');
                input.blur();
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!selectorWrapper.contains(e.target)) {
                dropdown.classList.remove('active');
            }
        });

        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.min = '1';
        qtyInput.value = itemData.quantity;
        qtyInput.title = 'Количество';
        qtyInput.setAttribute('data-path', `p${pIndex}-t${tIndex}-${side}-${itemIndex}-qty`);
        qtyInput.onchange = (e) => {
            profiles[pIndex].trades[tIndex][side][itemIndex].quantity = parseInt(e.target.value) || 1;
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleSync();
        };

        const levelInput = document.createElement('input');
        levelInput.type = 'number';
        levelInput.min = '1';
        levelInput.placeholder = 'Ур.';
        levelInput.title = 'Уровень предмета (необязательно)';
        levelInput.value = itemData.level || '';
        levelInput.style.width = '50px';
        levelInput.setAttribute('data-path', `p${pIndex}-t${tIndex}-${side}-${itemIndex}-lvl`);
        levelInput.onchange = (e) => {
            const val = e.target.value ? parseInt(e.target.value) : null;
            profiles[pIndex].trades[tIndex][side][itemIndex].level = val;
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleSync();
        };

        const removeItemBtn = document.createElement('button');
        removeItemBtn.className = 'btn-small danger';
        removeItemBtn.textContent = '×';
        removeItemBtn.style.padding = '2px 6px';
        removeItemBtn.onclick = () => {
            profiles[pIndex].trades[tIndex][side].splice(itemIndex, 1);
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleSync();
        };

        row.append(selectorWrapper, qtyInput, levelInput, removeItemBtn);
        return row;
    }
        
        function updateData(newId) {
            profiles[pIndex].trades[tIndex][side][itemIndex].itemId = newId;
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleImmediateSync();
        }

        let inputTimeout;
        input.addEventListener('input', (e) => {
            clearTimeout(inputTimeout);
            if (dataLoaded) updateDropdown(e.target.value);
            inputTimeout = setTimeout(() => {
                updateData(e.target.value);
            }, 300);
        });
        
        input.addEventListener('focus', () => { 
            if (dataLoaded) updateDropdown(input.value); 
        });
        
        input.addEventListener('blur', () => { 
            setTimeout(() => { 
                dropdown.classList.remove('active');
                updateData(input.value);
            }, 150); 
        });
        
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                updateData(input.value);
                dropdown.classList.remove('active');
                input.blur();
            } else if (e.key === 'Escape') {
                dropdown.classList.remove('active');
                input.blur();
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!selectorWrapper.contains(e.target)) dropdown.classList.remove('active');
        });

        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.min = '1';
        qtyInput.value = itemData.quantity;
        qtyInput.title = 'Количество';
        qtyInput.setAttribute('data-path', `p${pIndex}-t${tIndex}-${side}-${itemIndex}-qty`);
        qtyInput.onchange = (e) => {
            profiles[pIndex].trades[tIndex][side][itemIndex].quantity = parseInt(e.target.value) || 1;
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleSync();
        };

        const levelInput = document.createElement('input');
        levelInput.type = 'number';
        levelInput.min = '1';
        levelInput.placeholder = 'Ур.';
        levelInput.title = 'Уровень предмета (необязательно)';
        levelInput.value = itemData.level || '';
        levelInput.style.width = '50px';
        levelInput.setAttribute('data-path', `p${pIndex}-t${tIndex}-${side}-${itemIndex}-lvl`);
        levelInput.onchange = (e) => {
            const val = e.target.value ? parseInt(e.target.value) : null;
            profiles[pIndex].trades[tIndex][side][itemIndex].level = val;
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleSync();
        };

        const removeItemBtn = document.createElement('button');
        removeItemBtn.className = 'btn-small danger';
        removeItemBtn.textContent = '×';
        removeItemBtn.style.padding = '2px 6px';
        removeItemBtn.onclick = () => {
            profiles[pIndex].trades[tIndex][side].splice(itemIndex, 1);
            profiles[pIndex].trades[tIndex].edited = true;
            scheduleSync();
        };

        row.append(selectorWrapper, qtyInput, levelInput, removeItemBtn);
        return row;
    }

    function renderPreview() {
        const container = document.getElementById('gamePreview');
        container.innerHTML = '';
        
        if (!dataLoaded) {
            container.innerHTML = '<div class="loading-state">Загрузка предметов...</div>';
            return;
        }
        
        if (profiles.length === 0) {
            container.innerHTML = '<div class="empty-preview">Загрузите .cfg или нажмите «Пример»</div>';
            return;
        }
        
        profiles.forEach(profile => {
            profile.trades.forEach(trade => {
                const tradeEl = createTradePreview(trade);
                if (tradeEl) container.appendChild(tradeEl);
            });
        });
    }
    
    function createTradePreview(trade) {
        if (trade.costs.length === 0 || trade.rewards.length === 0) return null;
        
        const container = document.createElement('div');
        container.className = 'trade-item-preview';
        
        const costTextCol = document.createElement('div');
        costTextCol.className = 'cost-text-col';
        trade.costs.forEach(cost => {
            const row = document.createElement('div');
            row.className = 'trade-item-row-preview';
            const info = document.createElement('div');
            info.className = 'item-info-preview';
            
            const nameEl = document.createElement('div');
            nameEl.className = 'item-name-preview';
            let levelText = cost.level ? ` (${cost.level}★)` : '';
            nameEl.textContent = getItemName(cost.itemId) + levelText;
            
            const qtyEl = document.createElement('div');
            qtyEl.className = 'item-quantity-preview';
            qtyEl.textContent = `x${cost.quantity}`;
            
            info.append(nameEl, qtyEl);
            row.appendChild(info);
            costTextCol.appendChild(row);
        });
        
        const costIconCol = document.createElement('div');
        costIconCol.className = 'cost-icon-col';
        trade.costs.forEach(cost => {
            const iconEl = document.createElement('div');
            iconEl.className = 'item-icon-preview';
            const img = document.createElement('img');
            img.src = getItemIconUrl(cost.itemId);
            img.alt = cost.itemId;
            iconEl.appendChild(img);
            costIconCol.appendChild(iconEl);
        });
        
        const arrowCol = document.createElement('div');
        arrowCol.className = 'arrow-col';
        const arrow = document.createElement('div');
        arrow.className = 'exchange-arrow';
        arrow.title = 'наоборот';
        arrow.onclick = () => {
            const temp = trade.costs;
            trade.costs = trade.rewards;
            trade.rewards = temp;
            trade.edited = true;
            scheduleSync();
        };
        arrowCol.appendChild(arrow);
        
        const rewardIconCol = document.createElement('div');
        rewardIconCol.className = 'reward-icon-col';
        trade.rewards.forEach(reward => {
            const iconEl = document.createElement('div');
            iconEl.className = 'item-icon-preview';
            const img = document.createElement('img');
            img.src = getItemIconUrl(reward.itemId);
            img.alt = reward.itemId;
            iconEl.appendChild(img);
            rewardIconCol.appendChild(iconEl);
        });
        
        const rewardTextCol = document.createElement('div');
        rewardTextCol.className = 'reward-text-col';
        trade.rewards.forEach(reward => {
            const row = document.createElement('div');
            row.className = 'trade-item-row-preview';
            const info = document.createElement('div');
            info.className = 'item-info-preview';
            
            const nameEl = document.createElement('div');
            nameEl.className = 'item-name-preview';
            let levelText = reward.level ? ` (${reward.level}★)` : '';
            nameEl.textContent = getItemName(reward.itemId) + levelText;
            
            const qtyEl = document.createElement('div');
            qtyEl.className = 'item-quantity-preview';
            qtyEl.textContent = `x${reward.quantity}`;
            
            info.append(nameEl, qtyEl);
            row.appendChild(info);
            rewardTextCol.appendChild(row);
        });
        
        container.append(costTextCol, costIconCol, arrowCol, rewardIconCol, rewardTextCol);
        return container;
    }

    function updateProfileId(index, newId) {
        profiles[index].id = newId.trim();
        scheduleSync();
    }

    function addNewProfile() {
        const name = prompt('Введите ID профиля торговца:', 'NewTrader');
        if (name) {
            profiles.push({ id: name.trim(), trades: [] });
            scheduleSync();
        }
    }

    function scheduleSync() {
        if (isSyncing) clearTimeout(syncTimeout);
        isSyncing = true;
        syncTimeout = setTimeout(() => {
            doSync();
        }, 150);
    }
    
    function scheduleImmediateSync() {
        if (isSyncing) clearTimeout(syncTimeout);
        isSyncing = true;
        syncTimeout = setTimeout(() => {
            doSync();
        }, 50);
    }
    
    function doSync() {
        const cfg = generateCFG();
        document.getElementById('cfgInput').value = cfg;
        
        const config = getCurrentConfig();
        if (config) {
            config.code = cfg;
            config.profiles = JSON.parse(JSON.stringify(profiles));
        }
        
        renderWithFocusRestore(() => {
            renderVisual();
            renderPreview();
        });
        isSyncing = false;
    }

    function updateEditorFromCode() {
        if (isSyncing) return;
        const text = document.getElementById('cfgInput').value;
        parseCFG(text);
    }

    function exportCFG() {
        const config = getCurrentConfig();
        if (!config) return;
        
        const cfg = generateCFG();
        const blob = new Blob([cfg], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = config.name.endsWith('.cfg') ? config.name : `${config.name}.cfg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadItemsData();
        
        const defaultConfig = createConfig();
        configs.push(defaultConfig);
        activeConfigId = defaultConfig.id;
        renderTabs();
        
        let codeTimeout;
        document.getElementById('cfgInput').addEventListener('input', (e) => {
            clearTimeout(codeTimeout);
            codeTimeout = setTimeout(() => updateEditorFromCode(), 600);
        });
    });
</script>
</body>
